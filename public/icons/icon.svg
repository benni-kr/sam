<svg width="512" height="512" viewBox="0 0 1236 1236" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="SAM">
  <defs>
    <!-- Background -->
    <linearGradient id="bg" x1="0" y1="0" x2="1236" y2="1236" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>

    <!-- S: pink/red -> orange -> purple -> blue -->
    <linearGradient id="gradS" x1="170" y1="805" x2="405" y2="490" gradientUnits="userSpaceOnUse">
      <stop offset="0"    stop-color="#ff4d6d"/>
      <stop offset="0.30" stop-color="#f0568f"/>
      <stop offset="0.52" stop-color="#f6913b"/>
      <stop offset="0.76" stop-color="#9b4be0"/>
      <stop offset="1"    stop-color="#5a6dff"/>
    </linearGradient>

    <!-- A: electric blue -> violet -> magenta -->
    <linearGradient id="gradA" x1="505" y1="815" x2="740" y2="480" gradientUnits="userSpaceOnUse">
      <stop offset="0"    stop-color="#1f6bff"/>
      <stop offset="0.35" stop-color="#5a3ff5"/>
      <stop offset="0.70" stop-color="#9b2ee6"/>
      <stop offset="1"    stop-color="#e13ecb"/>
    </linearGradient>

    <!-- M: bright blue -> cyan -> emerald green -->
    <linearGradient id="gradM" x1="832" y1="520" x2="1116" y2="820" gradientUnits="userSpaceOnUse">
      <stop offset="0"    stop-color="#1e9bff"/>
      <stop offset="0.33" stop-color="#00c6dd"/>
      <stop offset="0.66" stop-color="#06e0a8"/>
      <stop offset="1"    stop-color="#38ff8f"/>
    </linearGradient>

    <filter id="ds" x="-25%" y="-25%" width="150%" height="160%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <!-- Rounded background plate (purpose: any) -->
  <rect x="0" y="0" width="1236" height="1236" rx="270" ry="270" fill="url(#bg)"/>

  <!-- Wordmark, optically centered in the plate. -->
  <g transform="translate(600,618) scale(0.78) translate(-620,-653)">
    <g fill="none" stroke-linecap="round" stroke-linejoin="round" filter="url(#ds)">

      <!-- S -->
      <g>
        <path d="M405,565 C398,505 315,483 250,502 C178,522 168,592 218,628 C258,656 335,662 372,694 C428,742 412,808 345,828 C282,846 205,826 172,772"
              stroke="#000000" stroke-opacity="0.30" stroke-width="94" transform="translate(4,10)"/>
        <path d="M405,565 C398,505 315,483 250,502 C178,522 168,592 218,628 C258,656 335,662 372,694 C428,742 412,808 345,828 C282,846 205,826 172,772"
              stroke="url(#gradS)" stroke-width="94"/>
        <path d="M405,565 C398,505 315,483 250,502 C178,522 168,592 218,628 C258,656 335,662 372,694 C428,742 412,808 345,828 C282,846 205,826 172,772"
              stroke="#ffffff" stroke-opacity="0.42" stroke-width="30" transform="translate(-4,-9)"/>
      </g>

      <!-- A (dot serves as the crossbar; optical kerning toward S) -->
      <g transform="translate(-4,0)">
        <path d="M512,812 L606,498 C612,478 628,478 634,498 L728,812"
              stroke="#000000" stroke-opacity="0.30" stroke-width="94" transform="translate(4,10)"/>
        <path d="M512,812 L606,498 C612,478 628,478 634,498 L728,812"
              stroke="url(#gradA)" stroke-width="94"/>
        <path d="M512,812 L606,498 C612,478 628,478 634,498 L728,812"
              stroke="#ffffff" stroke-opacity="0.40" stroke-width="30" transform="translate(-4,-9)"/>
        <path d="M566,712 L674,712"
              stroke="#000000" stroke-opacity="0.30" stroke-width="50" transform="translate(4,10)"/>
        <path d="M566,712 L674,712" stroke="#7b3ff2" stroke-width="50"/>
        <path d="M566,712 L674,712"
              stroke="#ffffff" stroke-opacity="0.45" stroke-width="16" transform="translate(-3,-7)"/>
      </g>

      <!-- M -->
      <g>
        <path d="M832,812 L832,502 L974,706 L1116,502 L1116,812"
              stroke="#000000" stroke-opacity="0.30" stroke-width="94" transform="translate(4,10)"/>
        <path d="M832,812 L832,502 L974,706 L1116,502 L1116,812"
              stroke="url(#gradM)" stroke-width="94"/>
        <path d="M832,812 L832,502 L974,706 L1116,502 L1116,812"
              stroke="#ffffff" stroke-opacity="0.42" stroke-width="30" transform="translate(-4,-9)"/>
      </g>

    </g>
  </g>
</svg>
